services:
  - type: web
    name: special-kids-worksheets
    runtime: node
    rootDir: kids-pdf-store
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: special-kids-admin
    runtime: static
    staticPublishPath: ./kids-pdf-store/admin-portal
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
